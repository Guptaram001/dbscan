services:
  spark-master:
    image: apache/spark:3.4.2
    platform: linux/amd64
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -c "
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
      "
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ./shared:/opt/spark/shared
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:3.4.2
    platform: linux/amd64
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      bash -c "
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      "
    ports:
      - "8081:8081"
    volumes:
      - ./shared:/opt/spark/shared
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:3.4.2
    platform: linux/amd64
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      bash -c "
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      "
    ports:
      - "8082:8081"
    volumes:
      - ./shared:/opt/spark/shared
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
